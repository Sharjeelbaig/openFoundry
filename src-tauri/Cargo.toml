[package]
name = "openfoundry"
version = "0.3.0"
description = "openFoundry - a local AI workbench"
authors = ["openFoundry contributors"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "openfoundry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
