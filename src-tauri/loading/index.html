<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openFoundry</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 520px at 50% 0%, #251a35 0%, #121212 60%);
        color: #e8e8e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { text-align: center; }
      .mark {
        width: 54px;
        height: 54px;
        margin: 0 auto 18px;
        border-radius: 14px;
        background: #1d1d1d;
        display: grid;
        place-items: center;
        box-shadow: 0 16px 60px rgba(0,0,0,.4);
      }
      h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.02em; }
      p { margin: 0; color: #9b9b9b; font-size: 13px; }
      .dots { display: flex; justify-content: center; gap: 5px; margin-top: 18px; }
      .dots span {
        width: 5px; height: 5px; border-radius: 50%; background: #f0a25f;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: .15s; }
      .dots span:nth-child(3) { animation-delay: .3s; }
      @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#f0a25f">
          <path d="M12 2.4 14.8 9l6.8 1.1-5 4.8 1.2 6.7-5.8-3.1-5.8 3.1 1.2-6.7-5-4.8L9.2 9 12 2.4Z" />
          <rect x="10.6" y="15.1" width="2.8" height="6.2" rx="1.2" />
        </svg>
      </div>
      <h1>Starting openFoundry</h1>
      <p>Starting the local server on this computer…</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </main>
  </body>
</html>
