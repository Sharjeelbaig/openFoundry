[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfoundry-agent-framework"
version = "0.1.0"
description = "Microsoft Agent Framework helpers for a local openFoundry project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "agent-framework>=1.24.0",
  "azure-ai-projects>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openfoundry_agent_framework*"]
