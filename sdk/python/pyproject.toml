[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openfoundry-agent-framework"
version = "0.1.1"
description = "An independent adapter that runs Microsoft's Agent Framework SDK against a local openFoundry project — no Azure subscription, no Entra tenant."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sharjeel Baig" }]
keywords = [
  "openfoundry",
  "agent-framework",
  "microsoft-agent-framework",
  "foundry",
  "agents",
  "multi-agent",
  "orchestration",
  "local-llm",
  "ollama",
  "foundry-local",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "agent-framework>=1.24.0",
  "azure-ai-projects>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "openai>=1.40",
  "twine>=5.1",
  "websockets>=12",
]

[project.urls]
Homepage = "https://openfoundry.pages.dev"
Documentation = "https://github.com/Sharjeelbaig/openFoundry/blob/main/sdk/python/docs/index.md"
Repository = "https://github.com/Sharjeelbaig/openFoundry"
Issues = "https://github.com/Sharjeelbaig/openFoundry/issues"
Changelog = "https://github.com/Sharjeelbaig/openFoundry/blob/main/sdk/python/CHANGELOG.md"
Brand = "https://github.com/Sharjeelbaig/openFoundry/blob/main/BRAND.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["openfoundry_agent_framework*"]

[tool.setuptools.package-data]
openfoundry_agent_framework = ["py.typed"]
