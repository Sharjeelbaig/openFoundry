<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openFoundry documentation</title>
    <meta
      name="description"
      content="Setup, authentication, agent builder and workflows for openFoundry, the local AI workbench."
    />
    <meta name="theme-color" content="#1f1f1f" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="../assets/openfoundry-icon.svg" type="image/svg+xml" />
    <link rel="canonical" href="{{SITE_URL}}/docs/" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("openfoundry-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="../assets/docs.css" />
    <style>
      html,
      body {
        background: var(--of-bg);
        color: var(--of-text);
      }
    </style>
    {{STYLES}}
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="openFoundry" />
    <meta property="og:title" content="openFoundry documentation" />
    <meta
      property="og:description"
      content="Four lessons: setup, authentication, agent builder and workflows."
    />
    <meta property="og:url" content="{{SITE_URL}}/docs/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/Sharjeelbaig/openFoundry/main/landing/assets/og.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">{{HTML}}</div>
    <script type="module" src="../assets/docs.js"></script>
  </body>
</html>
